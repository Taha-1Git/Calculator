<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simple Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <div class="screen">
      <div id="expression" class="expression" aria-hidden="true"></div>
      <div id="display" class="display" role="status" aria-live="polite">0</div>
    </div>

    <div class="keys">
      <button class="key fn" data-type="clear" aria-label="All clear">AC</button>
      <button class="key fn" data-type="backspace" aria-label="Backspace">&#9003;</button>
      <button class="key fn" data-type="percent" aria-label="Percent">%</button>
      <button class="key op" data-type="operator" data-value="/" aria-label="Divide">&divide;</button>

      <button class="key" data-type="digit" data-value="7">7</button>
      <button class="key" data-type="digit" data-value="8">8</button>
      <button class="key" data-type="digit" data-value="9">9</button>
      <button class="key op" data-type="operator" data-value="*" aria-label="Multiply">&times;</button>

      <button class="key" data-type="digit" data-value="4">4</button>
      <button class="key" data-type="digit" data-value="5">5</button>
      <button class="key" data-type="digit" data-value="6">6</button>
      <button class="key op" data-type="operator" data-value="-" aria-label="Subtract">&minus;</button>

      <button class="key" data-type="digit" data-value="1">1</button>
      <button class="key" data-type="digit" data-value="2">2</button>
      <button class="key" data-type="digit" data-value="3">3</button>
      <button class="key op" data-type="operator" data-value="+" aria-label="Add">+</button>

      <button class="key" data-type="digit" data-value="0">0</button>
      <button class="key" data-type="decimal" aria-label="Decimal point">.</button>
      <button class="key fn" data-type="negate" aria-label="Toggle sign">&plusmn;</button>
      <button class="key eq" data-type="equals" aria-label="Equals">=</button>
    </div>
  </main>

  <script src="calculator.js"></script>
  <script src="app.js"></script>
</body>
</html>
